<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#26333d">
  <title>Lünse</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="lib/pouchdb.min.js"></script>
</head>
<body>

  <header class="kopfzeile">
    <button type="button" id="nav-knopf" class="kopf-knopf nav-knopf"
      aria-expanded="false" aria-controls="modul-nav">
      <span aria-hidden="true">☰</span>
      <span class="visually-hidden">Module öffnen</span>
    </button>
    <div class="marke">
      <span class="marke-logo" aria-hidden="true">⌖</span>
      <span class="marke-name">Lünse</span>
    </div>
    <label class="baustellen-wahl">
      <span class="visually-hidden">Baustelle wählen</span>
      <select id="baustellen-auswahl" disabled>
        <option>Noch keine Baustellen</option>
      </select>
    </label>
    <button type="button" id="stamm-knopf" class="kopf-knopf" title="Baustellen-Stamm">
      <span aria-hidden="true">⚙</span>
      <span class="visually-hidden">Baustellen-Stamm öffnen</span>
    </button>
  </header>

  <div id="nav-schleier" class="nav-schleier" hidden></div>
  <nav id="modul-nav" class="modul-nav" aria-label="Module" hidden>
    <div id="nav-gruppen"></div>
    <!-- Backup/Import bewusst in der Leiste statt im Inhalt: kein
         versehentliches Antippen beim Arbeiten. -->
    <div id="nav-fuss" class="nav-fuss"></div>
  </nav>

  <main id="modulbereich" class="modulbereich">
    <div class="leerzustand">
      <p class="leerzustand-titel">Noch kein Modul geladen</p>
      <p class="leerzustand-text">Das Ereignis-Journal folgt in den nächsten Etappen.</p>
    </div>
  </main>


  <script type="module">
    // Shell: Kopfzeilen-Auswahl füttern, Module registrieren, Stamm anbieten.
    import { alleBaustellen, renderStammAnsicht } from './kern/stamm.js';
    import { renderBackupZeile } from './kern/export.js';
    import ereignisModul from './module/ereignis.js';
    import pendenzenModul from './module/pendenzen.js';
    import rapportModul from './module/rapport.js';
    import protokolleModul from './module/protokolle.js';
    import auswertungModul from './module/auswertung.js';
    import ausmassModul from './module/ausmass.js';
    import nachtragModul from './module/nachtrag.js';
    import dossierModul from './module/dossier.js';
    import rechnungModul from './module/rechnung.js';
    import offertModul from './module/offert.js';

    // Modul-Registrierung: mehr Kopplung gibt es nicht.
    const MODULE = [dossierModul, ereignisModul, pendenzenModul, rapportModul,
      ausmassModul, nachtragModul, rechnungModul, protokolleModul,
      auswertungModul, offertModul];

    const auswahl = document.getElementById('baustellen-auswahl');
    const modulbereich = document.getElementById('modulbereich');
    const modulNav = document.getElementById('modul-nav');
    const MERKER = 'luense.aktiveBaustelle'; // nur UI-Zustand, keine Daten
    const MODUL_MERKER = 'luense.aktivesModul';
    let ansicht = 'modul'; // 'modul' oder 'stamm'
    let aktivesModul = Math.max(0,
      MODULE.findIndex((m) => m.name === localStorage.getItem(MODUL_MERKER)));

    async function aktualisiereAuswahl() {
      const baustellen = await alleBaustellen();
      auswahl.innerHTML = '';
      if (!baustellen.length) {
        auswahl.append(new Option('Noch keine Baustellen', ''));
        auswahl.disabled = true;
        return baustellen;
      }
      auswahl.disabled = false;
      for (const b of baustellen) {
        auswahl.append(new Option(`${b.ktr} · ${b.name}`, b.baustelleId));
      }
      const gemerkt = localStorage.getItem(MERKER);
      if (baustellen.some((b) => b.baustelleId === gemerkt)) auswahl.value = gemerkt;
      localStorage.setItem(MERKER, auswahl.value);
      return baustellen;
    }

    let aktuelleBaustelle = null;

    // Seitenleiste im Cockpit-Stil: Module in vier Gruppen. Module, die in
    // keiner Gruppe stehen (z. B. neue), landen automatisch unter Verwaltung.
    const NAV_GRUPPEN = [
      ['Übersicht', ['Dossier', 'Controlling']],
      ['Erfassung', ['Journal', 'Rapporte', 'Ausmass']],
      ['Verwaltung', ['Pendenzen', 'Nachträge', 'Rechnungen', 'Offerten']],
      ['Wissen', ['Protokolle']],
    ];

    async function zeichneModulNav() {
      const anzahlen = await Promise.all(MODULE.map((modul) =>
        modul.badge && aktuelleBaustelle ? modul.badge(aktuelleBaustelle) : null));
      const gruppiert = new Set(NAV_GRUPPEN.flatMap(([, namen]) => namen));
      const eintrag = (modul, index) => `
        <button type="button" class="knopf nav-eintrag${index === aktivesModul ? ' aktiv' : ''}"
          data-index="${index}">${modul.name}${
            anzahlen[index] ? `<span class="badge-anzahl">${anzahlen[index]}</span>` : ''
          }</button>`;
      document.getElementById('nav-gruppen').innerHTML = NAV_GRUPPEN.map(([titel, namen]) => {
        const eintraege = MODULE
          .map((modul, index) => ({ modul, index }))
          .filter(({ modul }) => namen.includes(modul.name)
            || (titel === 'Verwaltung' && !gruppiert.has(modul.name)))
          .map(({ modul, index }) => eintrag(modul, index));
        return eintraege.length ? `
          <div class="nav-gruppe">
            <p class="nav-gruppe-titel">${titel}</p>
            ${eintraege.join('')}
          </div>` : '';
      }).join('');
    }

    // Auf dem Handy liegt die Leiste als Overlay links — Hamburger öffnet,
    // Tap daneben oder Modulwahl schliesst. Auf dem Laptop steht sie fix.
    const navKnopf = document.getElementById('nav-knopf');
    const navSchleier = document.getElementById('nav-schleier');
    function schalteNav(offen) {
      document.body.classList.toggle('nav-offen', offen);
      navSchleier.hidden = !offen;
      navKnopf.setAttribute('aria-expanded', String(offen));
    }
    navKnopf.addEventListener('click', () =>
      schalteNav(!document.body.classList.contains('nav-offen')));
    navSchleier.addEventListener('click', () => schalteNav(false));

    // Module melden Datenänderungen über dieses Ereignis — die Shell
    // aktualisiert damit die Badges, ohne dass Module sie kennen müssen.
    document.addEventListener('luense:daten', () => {
      if (ansicht === 'modul') zeichneModulNav();
    });

    // Ein Modul (z. B. die Controlling-Übersicht) bittet um den Wechsel
    // zu einer anderen Baustelle — Auswahl vorher auffrischen, damit
    // auch eben erst erstellte Baustellen (Offerte → Baustelle) da sind.
    document.addEventListener('luense:baustelleWechseln', async (ereignis) => {
      const ziel = ereignis.detail?.baustelleId;
      if (!ziel) return;
      await aktualisiereAuswahl();
      auswahl.value = ziel;
      localStorage.setItem(MERKER, ziel);
      zeigeModul();
    });

    // Ein Modul (z. B. das Dossier) bittet um den Wechsel zu einem Modul.
    document.addEventListener('luense:modulWechseln', (ereignis) => {
      const index = MODULE.findIndex((m) => m.name === ereignis.detail?.name);
      if (index < 0) return;
      aktivesModul = index;
      localStorage.setItem(MODUL_MERKER, MODULE[index].name);
      zeigeModul();
    });

    modulNav.addEventListener('click', (klick) => {
      const knopf = klick.target.closest('[data-index]');
      if (!knopf) return;
      aktivesModul = Number(knopf.dataset.index);
      localStorage.setItem(MODUL_MERKER, MODULE[aktivesModul].name);
      schalteNav(false);
      zeigeModul();
    });

    async function zeigeModul() {
      const baustellen = await alleBaustellen();
      const baustelle = baustellen.find((b) => b.baustelleId === auswahl.value);
      if (!baustelle) {
        zeigeStamm();
        return;
      }
      ansicht = 'modul';
      aktuelleBaustelle = baustelle;
      modulNav.hidden = false;
      zeichneModulNav();
      MODULE[aktivesModul].render(modulbereich, baustelle);
    }

    function zeigeStamm() {
      ansicht = 'stamm';
      modulNav.hidden = true;
      schalteNav(false);
      renderStammAnsicht(modulbereich, { onAenderung: aktualisiereAuswahl });
      // Ohne Baustellen ist die Seitenleiste zu — der Import (z. B. Backup
      // auf einem neuen Gerät einspielen) muss hier trotzdem erreichbar sein.
      const backupEcke = document.createElement('div');
      backupEcke.className = 'karte nav-fuss stamm-backup';
      modulbereich.querySelector('.stamm').append(backupEcke);
      renderBackupZeile(backupEcke, { nachImport: nachDatenImport });
    }

    auswahl.addEventListener('change', () => {
      localStorage.setItem(MERKER, auswahl.value);
      if (ansicht === 'modul') zeigeModul();
    });

    // ⚙ wechselt zwischen Stamm und aktivem Modul.
    document.getElementById('stamm-knopf').addEventListener('click', () => {
      if (ansicht === 'stamm') zeigeModul();
      else zeigeStamm();
    });

    async function nachDatenImport() {
      await aktualisiereAuswahl();
      zeigeModul();
    }

    renderBackupZeile(document.getElementById('nav-fuss'), {
      nachImport: nachDatenImport,
    });

    await aktualisiereAuswahl();
    zeigeModul(); // ohne Baustellen landet man automatisch im Stamm

    // Offline-Faehigkeit: Service-Worker cacht alle App-Dateien.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
