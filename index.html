<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Lünse</title>
  <link rel="stylesheet" href="style.css">
  <script src="lib/pouchdb.min.js"></script>
</head>
<body>

  <header class="kopfzeile">
    <div class="marke">
      <span class="marke-logo" aria-hidden="true">⌖</span>
      <span class="marke-name">Lünse</span>
    </div>
    <label class="baustellen-wahl">
      <span class="visually-hidden">Baustelle wählen</span>
      <select id="baustellen-auswahl" disabled>
        <option>Noch keine Baustellen</option>
      </select>
    </label>
  </header>

  <main id="modulbereich" class="modulbereich">
    <div class="leerzustand">
      <p class="leerzustand-titel">Noch kein Modul geladen</p>
      <p class="leerzustand-text">Baustellen-Stamm und Ereignis-Journal folgen in den nächsten Etappen.</p>
    </div>
  </main>

  <script type="module">
    // Abend 1: nur Startkontrolle — Kern und Module folgen ab Abend 2.
    if (typeof PouchDB !== 'function') {
      document.querySelector('.leerzustand-text').textContent =
        'Achtung: lib/pouchdb.min.js konnte nicht geladen werden.';
    }
  </script>

</body>
</html>
